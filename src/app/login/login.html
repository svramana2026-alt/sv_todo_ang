<h1>Login</h1>

<div class="alert alert-warning" *ngIf='invalidCredentials'>Invalid credentials.</div>

<div class="container">
    Username: <input type="text" name="username" [(ngModel)]="username">
    Password: <input type="password" name="password" [(ngModel)]="password">

    {{username}}
    <button class="btn btn-primary" (click)=doLogin()>Login</button>
</div>
